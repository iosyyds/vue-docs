  - type: story
    label: 心路历程
    title: 为什么建站？
    content: |
      建这个站的时候，是为了能够有一个自己能够**积累知识**和**兴趣**的地方。和他人分享知识和经验，如果能够帮助到更多的人，帮助更多人解决问题，那一定是非常棒的事情。

      这里大多都是**技术向**的文章，也是对自己的成长的记录，如果在下的某篇文章能够帮助到你，那我也是很开心的。

      这些就是创造这个小站的本意，**也是用于分享生活**。有幸能和你相遇在这里，相信我们能共同留下一段美好记忆。
