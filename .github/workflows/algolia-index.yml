name: Push Algolia Index

on:
  push:
    branches: [main]
    paths:
      - "posts/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  push-index:
    runs-on: ubuntu-latest
    env:
      ALGOLIA_APP_ID: "0NOSBY3UK7"
      ALGOLIA_ADMIN_KEY: ${{ secrets.ALGOLIA_ADMIN_KEY }}
      ALGOLIA_INDEX: "xkbk"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Push to Algolia
        if: ${{ env.ALGOLIA_ADMIN_KEY != '' }}
        run: node scripts/push-algolia.mjs
