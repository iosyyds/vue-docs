baseURL: https://xkbk.cn/
title: 小坤哥哥博客
locale: zh-CN
defaultContentLanguage: zh-cn
timeZone: Asia/Shanghai
enableRobotsTXT: true
theme: solitude

outputs:
  home: [HTML, RSS, Search, Links]
  section: [HTML, RSS]
  taxonomy: [HTML, RSS]
  term: [HTML, RSS]

uglyURLs:
  posts: true

permalinks:
  posts: /p/:slug

pagination:
  pagerSize: 8

markup:
  goldmark:
    renderer:
      unsafe: true

menus:
  main:
    - name: 文库
      identifier: library
      weight: 10
    - name: 导航
      identifier: navi
      weight: 20
    - name: 我的
      identifier: personal
      weight: 30
    - name: 全部文章
      pageRef: /archives
      parent: library
      weight: 10
      params:
        icon: fas fa-folder-closed
    - name: 全部分类
      pageRef: /categories
      parent: library
      weight: 20
      params:
        icon: fas fa-clone
    - name: 全部标签
      pageRef: /tags
      parent: library
      weight: 30
      params:
        icon: fas fa-tags
    - name: 个人导航
      pageRef: /nav
      parent: navi
      weight: 10
      params:
        icon: fas fa-compass
    - name: 友情链接
      pageRef: /links
      parent: navi
      weight: 20
      params:
        icon: fas fa-link
    - name: 站点订阅
      url: /index.xml
      parent: navi
      weight: 30
      params:
        icon: fas fa-rss
    - name: 关于本站
      pageRef: /about
      parent: personal
      weight: 10
      params:
        icon: fas fa-user
    - name: 隐私政策
      pageRef: /privacy
      parent: personal
      weight: 20
      params:
        icon: fas fa-shield-halved

params:
  author:
    name: 小坤哥哥
    email: admin@xkbk.cn
  description: 小坤哥哥的个人博客，记录技术分享与生活点滴
  solitude:
    site:
      name:
        class: text
        custom: 小坤哥哥博客
      icon: /logo.svg
    nav:
      group:
        博客:
          - name: 主站
            url: /
            icon: /logo.svg
          - name: 网事集
            url: https://puaaa.cn
            icon: /images/icons/puaaa.png
        服务:
          - name: 甜甜导航
            url: https://iosdh.cn
            icon: /images/icons/iosdh.svg
          - name: 甜甜发卡
            url: https://qqqi.top
            icon: /images/icons/qqqi.png
          - name: 我的药盒
            url: https://yao.hugv.me
            icon: /logo.svg
          - name: 甜甜游戏
            url: https://love.ttla.top
            icon: /images/icons/love.png
        项目:
          - name: GitHub
            url: https://github.com/iosyyds/vue-docs
            icon: /images/icons/github.svg
    hometop:
      enable: true
      banner:
        title: 欢迎来到<br>小坤哥哥博客
        desc: 记录技术分享、生活点滴和日常折腾
      recommendList:
        - title: 欢迎来到小坤哥哥博客
          url: /p/hello.html
          cover: /images/covers/cover_free-api.jpg
          label: 置顶
          color: "#425aef"
    aside:
      home:
        noSticky: about
        Sticky: allInfo
      post:
        noSticky: about
        Sticky: newestPost,newest_comment,allInfo
      page:
        noSticky: about
        Sticky: newestPost,newest_comment,allInfo
      my_card:
        author:
          img: /logo.svg
          emoji: "😊"
        description: 热爱折腾的开发者，前端为主，渴望全栈
        content: 这里有关于开发的问题和看法，也会分享一些奇技淫巧。
        witty_words: [源于热爱, 去开发优秀的作品, 热爱生活，保持好奇]
        information:
          - name: GitHub
            url: https://github.com/iosyyds/vue-docs
            icon: fab fa-github
          - name: 邮箱
            url: mailto:admin@xkbk.cn
            icon: fas fa-envelope
      siteinfo:
        postcount: true
        wordcount: true
        updatetime: true
        runtimeenable: true
        runtime: 2026-09-13 00:00:00
    post:
      default:
        copyright:
          author: /logo.svg
          author_background: /images/covers/cover_free-api.jpg
      meta:
        date: true
        updated: true
        locate: false
        wordcount: true
        readtime: true
        pv: false
        comment: true
    footer:
      information:
        author: /logo.svg
        left:
          - name: GitHub
            url: https://github.com/iosyyds/vue-docs
            icon: fab fa-github
          - name: 邮箱
            url: mailto:admin@xkbk.cn
            icon: fas fa-envelope
        right:
          - name: 订阅
            url: /index.xml
            icon: fas fa-rss
      group:
        博客:
          - name: 近期文章
            url: /
          - name: 全部分类
            url: /categories/
          - name: 全部标签
            url: /tags/
          - name: 文章归档
            url: /archives/
        导航:
          - name: 个人导航
            url: /nav/
          - name: 友情链接
            url: /links/
          - name: 甜甜发卡
            url: https://qqqi.top
          - name: 站点订阅
            url: /index.xml
        页面:
          - name: 关于本站
            url: /about/
          - name: 隐私政策
            url: /privacy/
        专栏:
          - name: Vue 指南
            url: /guide/what-is-vue/
          - name: 快速上手
            url: /guide/getting-started/
          - name: 模板语法
            url: /guide/template-syntax/
      links:
        - name: 订阅
          url: /index.xml
    comment:
      use: giscus
      commentBarrage: false
      lazyload: false
      count: true
      sidebar: true
      pv: false
      avatar: https://weavatar.com
      newest_comment:
        enable: true
        storage: 0.5
        limit: 5
    giscus:
      repo: iosyyds/vue-docs
      repo_id: R_kgDOUYGXcA
      category_id: DIC_kwDOUYGXcM4DFdMe
      mapping: pathname
      theme:
        light: light
        dark: dark
    search:
      enable: true
      type: local
      local:
        preload: true
        CDN: /search.xml
    extends:
      head:
        - |
          <style>
          /* 顶部导航栏显示背景 */
          #page-header:not(.nav-fixed) #nav,
          #page-header.nav-fixed #nav {
            background: var(--efu-card-bg);
            -webkit-backdrop-filter: blur(20px);
            backdrop-filter: blur(20px);
            border-bottom: 2px solid var(--efu-theme);
            box-shadow: 0 4px 16px -4px rgba(0,0,0,0.08);
          }
          #page-header:not(.nav-fixed) #nav a,
          #page-header:not(.nav-fixed) #nav #site-name i,
          #page-header:not(.nav-fixed) #nav #site-name span.title {
            color: var(--efu-fontcolor);
          }
          #page-header:not(.nav-fixed) #nav a:hover {
            background: var(--efu-lighttext);
            color: var(--efu-nav-hover-text);
          }
          #page-header:not(.nav-fixed) #nav #nav-right .nav-button a.console_switchbutton label i,
          .post #page-header:not(.nav-fixed) #nav #nav-right .nav-button .console_switchbutton label i {
            background: var(--efu-fontcolor);
          }
          </style>
