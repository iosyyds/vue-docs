<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>评论管理 | 小坤哥哥博客</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: #f4f6f9;
      color: #333;
      min-height: 100vh;
    }
    .header {
      background: linear-gradient(135deg, #4f7cff, #6a5cff);
      color: #fff;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 10px rgba(0,0,0,.1);
    }
    .header h1 {
      font-size: 18px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header .back {
      color: #fff;
      text-decoration: none;
      font-size: 13px;
      background: rgba(255,255,255,.18);
      padding: 6px 14px;
      border-radius: 20px;
      transition: background .2s;
    }
    .header .back:hover { background: rgba(255,255,255,.32); }
    .container {
      max-width: 1400px;
      margin: 24px auto;
      padding: 0 16px;
    }
    .tip {
      background: #eaf1ff;
      border: 1px solid #c9d9ff;
      color: #3b5bd8;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 13px;
      line-height: 1.7;
      margin-bottom: 18px;
    }
    .tip code {
      background: #fff;
      padding: 2px 8px;
      border-radius: 5px;
      font-size: 12px;
      border: 1px solid #d4deff;
    }
    .card {
      background: #fff;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 2px 12px rgba(0,0,0,.06);
    }
    /* 管理面板容器占满剩余视口高度，配合全屏样式让管理面板铺满浏览器 */
    #twikoo-comment {
      min-height: calc(100vh - 150px);
    }
    /* 关键：Twikoo 管理面板覆盖层强制全屏铺满浏览器窗口（admin.html 为独立页，必须自带此样式） */
    .tk-admin {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 9999 !important;
    }
    .tk-admin.__show {
      left: 0 !important;
    }
    .error-box {
      text-align: center;
      margin-top: 90px;
      font-size: 15px;
      color: #888;
    }
    .error-box code {
      background: #eee;
      padding: 3px 10px;
      border-radius: 6px;
      font-size: 13px;
    }
    @media (max-width: 640px) {
      .header { padding: 14px 16px; }
      .container { margin: 14px auto; }
      .card { padding: 14px; }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>💬 评论管理面板</h1>
    <a class="back" href="https://xkbk.cn/" target="_blank">← 返回博客</a>
  </div>
  <div class="container">
    <div class="tip">
      页面已用管理员身份打开。下方评论区会出现 <strong>管理入口</strong>（齿轮图标），点击后输入管理员密码 <code>xkbk666</code> 即可进入管理面板：回复/删除评论、修改评论设置等。
    </div>
    <div class="card">
      <div id="twikoo-comment"></div>
    </div>
  </div>

  <!-- Twikoo 前端脚本（同源本地优先，CDN 兜底）+ 暗号校验 + 初始化 -->
  <script>
    (function () {
      var CRYPT = "xkbk666";
      var params = new URLSearchParams(window.location.search);
      var pass = params.get("twikoo") === CRYPT;

      if (!pass) {
        document.addEventListener("DOMContentLoaded", function () {
          document.querySelector(".container").innerHTML =
            '<div class="error-box">该页面需要携带暗号参数才能打开<br>正确地址：<code>https://xkbk.cn/admin.html?twikoo=xkbk666</code><br><br>（暗号错误或缺失时自动隐藏）</div>';
        });
        return;
      }

      // 备份当前本地昵称，管理期间临时使用暗号身份唤起管理入口
      var KEY = "twikoo";
      var backup = null;
      try { backup = localStorage.getItem(KEY); } catch (e) {}
      try {
        localStorage.setItem(KEY, JSON.stringify({ nick: CRYPT, mail: "", link: "" }));
      } catch (e) {}
      // 离开页面时恢复原昵称，不影响日常评论
      window.addEventListener("beforeunload", function () {
        try {
          if (backup) localStorage.setItem(KEY, backup);
          else localStorage.removeItem(KEY);
        } catch (e) {}
      });

      // 加载 Twikoo 脚本（同源优先），加载成功且未初始化时 init 一次
      var sources = [
        "/js/twikoo.min.js",
        "https://cdn.staticfile.org/twikoo/1.7.24/twikoo.all.min.js",
        "https://cdn.jsdelivr.net/npm/twikoo@1.7.24/dist/twikoo.all.min.js",
        "https://unpkg.com/twikoo@1.7.24/dist/twikoo.all.min.js"
      ];
      var i = 0;
      var inited = false;
      function initPanel() {
        if (inited) return;
        if (window.twikoo && typeof window.twikoo.init === "function") {
          inited = true;
          window.twikoo.init({ el: "#twikoo-comment", envId: "https://bk.puaaa.cn/", lang: "zh-CN" });
        }
      }
      function loadNext() {
        if (i >= sources.length) return;
        var s = document.createElement("script");
        s.src = sources[i++];
        s.onload = initPanel;
        s.onerror = loadNext;
        document.head.appendChild(s);
      }
      loadNext();
    })();
  </script>
</body>
</html>
